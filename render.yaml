# Production-oriented Render Blueprint. These paid plans keep the app online
# and the database persistent; adjust plan sizes in Render to fit actual usage.
databases:
  - name: kenchain-db
    region: singapore
    plan: 0.1c-256mb
    databaseName: kenchaingroups
    user: kenchainuser
    ipAllowList: []

services:
  - type: web
    name: kenchain-groups
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    buildCommand: bash build.sh
    preDeployCommand: bash release.sh
    startCommand: gunicorn kenchain.wsgi:application --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-2} --threads 4 --timeout 60 --access-logfile - --error-logfile -
    healthCheckPath: /health/
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kenchain-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_TRUST_PROXY_SSL
        value: "1"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: WEB_CONCURRENCY
        value: "2"
